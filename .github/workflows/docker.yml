name: Build and Push Docker Image

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Build, push and tag Docker image
        uses: SURIMI-Project/Surimi-GithubActions/ReleaseDockerUbuntuBSR@master
        with:
          image-name: ghcr.io/surimi-project/surimifisheriesauthority
          bsr-token: ${{ secrets.BSR_TOKEN }}
          dockerfile: ./SURIMI-fisheries-authority/Dockerfile
